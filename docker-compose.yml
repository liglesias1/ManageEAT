# The whole ManageEAT system for local development, from a clean clone:
#
#   cp .env.example .env      # then fill in the four values
#   docker compose up --build
#
# UI: http://localhost:8080   personnel: http://localhost:8001   sales: http://localhost:8002
# Secrets come from .env, which is not committed; compose refuses to start if one is missing.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64          # SQL Server only exists for Intel; on Apple Silicon it runs through Rosetta
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer         # free edition for development
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"                # so the tests running on your machine can reach it
    volumes:
      - sqlserver-data:/var/opt/mssql   # the data survives docker compose down (not down -v)
    healthcheck:                   # healthy once it answers a query; db-init waits for this
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  db-init:                         # one-off: creates the databases and logins, then exits
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      SALES_DB_PASSWORD: ${SALES_DB_PASSWORD:?set SALES_DB_PASSWORD in .env}
      PERSONNEL_DB_PASSWORD: ${PERSONNEL_DB_PASSWORD:?set PERSONNEL_DB_PASSWORD in .env}
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /init.sql
        -v SALES_DB_PASSWORD="$$SALES_DB_PASSWORD" PERSONNEL_DB_PASSWORD="$$PERSONNEL_DB_PASSWORD"
    restart: "no"

  personnel:
    build:
      context: services/personnel
      args:
        GIT_SHA: ${GIT_SHA:-dev}   # GIT_SHA=$(git rev-parse --short HEAD) docker compose up --build
    depends_on:
      db-init:
        condition: service_completed_successfully   # its database and login exist before it connects
    environment:
      # Its own login, which can only open the personnel database
      DATABASE_URL: mssql://personnel_app:${PERSONNEL_DB_PASSWORD:?set PERSONNEL_DB_PASSWORD in .env}@sqlserver:1433/personnel
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET in .env}
      SALES_URL: http://sales:8000         # the other service, by its name on the compose network
      CORS_ORIGINS: http://localhost:8080  # the UI below
    ports:
      - "8001:8000"                # the browser calls it here (config.js)
    healthcheck: &health           # 200 only when it can write to and read its own database
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  sales:
    build:
      context: services/sales
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://sales_app:${SALES_DB_PASSWORD:?set SALES_DB_PASSWORD in .env}@sqlserver:1433/sales
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET in .env}
      PERSONNEL_URL: http://personnel:8000
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8002:8000"
    healthcheck: *health
    restart: unless-stopped

  ui:                              # the static UI, served as it is: a stock image with the folder mounted
    image: nginx:1.27-alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  sqlserver-data: