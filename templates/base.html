<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} · ManageEAT</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/chart.umd.min.js"></script>
</head>
<body>
  {% set path = request.url.path %}
  <aside class="sidebar">
    <a class="brand" href="/">Manage<span>EAT</span></a>
    <p class="brand-sub">Restaurant management</p>
    <nav>
      <p class="nav-group">Sales</p>
      <a href="/sales/menu" class="{{ 'active' if path == '/sales/menu' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        Menu performance
      </a>
      <a href="/sales/inventory" class="{{ 'active' if path == '/sales/inventory' or path.startswith('/sales/suppliers') else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
        Inventory
      </a>
      <p class="nav-group">Personnel</p>
      <a href="/personnel/schedule" class="{{ 'active' if path == '/personnel/schedule' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Staff &amp; schedule
      </a>
      <a href="/personnel/payroll" class="{{ 'active' if path == '/personnel/payroll' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
        Payroll
      </a>
    </nav>
  </aside>

  <main class="content">
    <header class="page-header">
      <h1>{% block heading %}{% endblock %}</h1>
      <p class="page-intro">{% block intro %}{% endblock %}</p>
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
