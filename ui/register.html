<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account · ManageEAT</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="static/style.css">
  <script src="config.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <p class="brand">Manage<span>EAT</span></p>
    <p class="brand-sub">Restaurant management</p>
    <h1>Create your restaurant's account</h1>
    <form class="form" id="register-form">
      <label>Restaurant name<input name="restaurant_name" required minlength="2" autofocus></label>
      <label>Your name<input name="name" required minlength="2" autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Password <span class="muted">(at least 8 characters)</span>
        <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
      <button type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a class="link" href="login.html">Log in</a></p>
  </main>
</body>
</html>
